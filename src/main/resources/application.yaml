server:
  port: 8080

spring:
  application:
    name: ms-digitalfix-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          # Emisor esperado. Spring descarga el JWKS desde aqui y valida la firma.
          # Requiere requestedAccessTokenVersion = 2 en el manifiesto del registro de la API.
          issuer-uri: https://login.microsoftonline.com/6e49fdba-8435-41ac-8074-7b1a04cfd543/v2.0

digitalfix:
  security:
    # Valores aceptados para el claim "aud".
    # Con requestedAccessTokenVersion = 2 el token trae el Application ID (GUID pelado).
    # Con v1 trae el Application ID URI (api://<guid>). Se aceptan ambos.
    audiences:
      - 13a645a9-ea0e-498e-96b8-55a3d56f10eb
      - api://13a645a9-ea0e-498e-96b8-55a3d56f10eb
  cors:
    allowed-origins:
      - http://localhost:4200
      - https://44.206.195.117
  servicios:
    workorders: http://localhost:8081
    audit: http://localhost:8083
    catalog: http://localhost:8082
    report: http://localhost:8086
    kafka-admin: http://localhost:8087